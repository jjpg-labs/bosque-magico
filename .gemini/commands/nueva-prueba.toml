description = "Añade una nueva prueba al catálogo de El Bosque Mágico siguiendo la arquitectura del proyecto"
prompt = """
Vas a añadir una prueba nueva a El Bosque Mágico de los Bichitos.

Lee docs/adding-a-prueba.md entero y sigue esa receta al pie de la letra: a
qué mundo pertenece la prueba y con qué id, dónde va el contenido nuevo
(data/<mundo>.ts), cómo se escribe el generador (generators/<mundo>.ts,
función pura que usa el `rng` inyectado, nunca Math.random()), cómo se
registra en catalog/<mundo>.ts (GAMES + STICKERS) más una línea en cada
barril, y cuándo hace falta un test propio además del barrido genérico que ya
cubre cualquier prueba registrada.

Empieza por las fábricas: mira la tabla de las ocho fábricas de
src/lib/games/generators/factories.ts en la guía y usa la que encaje. Es el
camino por defecto y garantiza por construcción que hay una sola respuesta
correcta y que ninguna opción repite lo que se ve. Solo escribe un generador
a mano si ninguna sirve, y en ese caso ponlo en tu generators/<mundo>.ts:
factories.ts está congelado.

No reasignes nunca un id ya usado ni retires una prueba (se perderían
pegatinas ya ganadas), y no pongas bg ni color en la pegatina nueva: se
heredan del mundo.

La idea de la prueba nueva es: {{args}}

Si esa idea no está clara o falta información (qué pregunta hace la prueba,
qué concepto trabaja, a qué mundo va), pregúntamelo antes de escribir código.

Antes de terminar, ejecuta:
npm run lint && npm run typecheck && npm test && npm run build
No des la tarea por terminada si alguno de esos comandos falla — arréglalo
primero. Añade también el id de la prueba a la tabla de mundos de README.md.
"""
